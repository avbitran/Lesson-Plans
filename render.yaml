# One-click hosting on Render (render.com): New → Blueprint → pick this repo.
services:
  - type: web
    name: online-tests
    runtime: node
    rootDir: online-tests
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/setup
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: test-data
      mountPath: /var/data
      sizeGB: 1
