<!DOCTYPE html>
<!-- Online Tests — pages; already included in Code.gs. Generated by build.js from apps-script/src/; edit those files, not this one. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --text: #1d1d1f;
  --muted: #6b6b70;
  --line: #deddd6;
  --accent: #2456c9;
  --accent-text: #ffffff;
  --accent-soft: #e6edfb;
  --ok: #1b7a43;
  --ok-soft: #e3f4e9;
  --warn: #9a5b00;
  --warn-soft: #fdf1dc;
  --danger: #b3261e;
  --danger-soft: #fbe7e5;
  --reading: #fff7c2;
  --radius: 10px;
  --test-fs: 20px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #17181b;
    --surface: #212226;
    --text: #ececef;
    --muted: #a0a0a8;
    --line: #36373d;
    --accent: #7aa2ff;
    --accent-text: #0d1424;
    --accent-soft: #24304d;
    --ok: #6fd39a;
    --ok-soft: #1c3326;
    --warn: #f0b860;
    --warn-soft: #3a2e17;
    --danger: #ff8a80;
    --danger-soft: #3d2120;
    --reading: #3d3a1c;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans Hebrew', Arial, sans-serif;
}

a { color: var(--accent); }
h1 { font-size: 1.7rem; margin: 0 0 .4rem; }
h2 { font-size: 1.25rem; margin: 1.2rem 0 .6rem; }
h3 { margin: .2rem 0 .4rem; }
code { background: var(--accent-soft); padding: .05em .35em; border-radius: 4px; font-size: .95em; }

.loading { padding: 2rem; text-align: center; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.strong { font-weight: 600; }
.error { color: var(--danger); font-weight: 500; }
.ok { color: var(--ok); }
.pre { white-space: pre-wrap; }
.danger { color: var(--danger); }

.wrap { max-width: 1100px; margin: 0 auto; padding: 1.5rem 16px 4rem; }
.center { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.narrow { width: min(440px, 100%); }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.2rem;
  margin-bottom: 1rem;
}
details.card > summary { cursor: pointer; }
details.card[open] > summary { margin-bottom: .8rem; }

.row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.row.tight { gap: .35rem; }
.row.end { justify-content: flex-end; }
.grow { flex: 1; min-width: 8rem; }

.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }

/* ------------------------------------------------------------- controls */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .3rem;
  font: inherit; font-weight: 500;
  padding: .45rem .9rem;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--accent-soft); border-color: transparent; }
.btn-big { padding: .7rem 1.4rem; font-size: 1.05rem; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

input, select, textarea {
  font: inherit;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: .5rem .65rem;
  max-width: 100%;
}
textarea { width: 100%; resize: vertical; }
.narrow-input { width: 6.5rem; }

.form { display: flex; flex-direction: column; gap: .9rem; }
.form > label, .form label:not(.check):not(.row) { display: flex; flex-direction: column; gap: .3rem; font-weight: 500; }
.form label > input:not([type='checkbox']):not([type='radio']), .form label > select { width: 100%; }
.grid-3 { display: grid; gap: .9rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.checks { display: grid; gap: .5rem; }
.check { display: flex; gap: .6rem; align-items: flex-start; font-weight: 400; }
.check input { margin-top: .3rem; }

.badge { display: inline-block; padding: .1rem .55rem; border-radius: 999px; font-size: .82rem; font-weight: 600; background: var(--accent-soft); color: var(--accent); }
.badge-ok, .badge-returned, .badge-open { background: var(--ok-soft); color: var(--ok); }
.badge-warn, .badge-submitted, .badge-locked { background: var(--warn-soft); color: var(--warn); }
.badge-draft, .badge-closed { background: var(--line); color: var(--muted); }

/* --------------------------------------------------------------- topbar */

.topbar { display: flex; align-items: center; gap: 1.2rem; padding: .6rem 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 700; text-decoration: none; color: var(--text); }
.topbar nav { display: flex; gap: 1rem; flex: 1; }
.topbar nav a { text-decoration: none; font-weight: 500; }
.who { display: flex; align-items: center; gap: .3rem; color: var(--muted); }

/* ---------------------------------------------------------------- tables */

.table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 1rem; }
.table th, .table td { text-align: start; padding: .6rem .7rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table th { font-size: .82rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); font-weight: 600; }
.table tr:last-child td { border-bottom: 0; }
.table td.row { display: table-cell; white-space: nowrap; }
.table td.row > * { margin-inline-end: .3rem; }
.table.compact td { padding: .3rem .6rem; }
.row-alert td { background: var(--warn-soft); }
@media (max-width: 760px) {
  .table, .table tbody, .table tr, .table td { display: block; width: 100%; }
  .table thead { display: none; }
  .table tr { border-bottom: 1px solid var(--line); padding: .4rem 0; }
  .table td { border: 0; padding: .2rem .7rem; }
}

/* ----------------------------------------------------------- dashboards */

.cards { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.test-card h2 { margin-top: 0; }
.score-big { font-size: 2rem; font-weight: 700; }

/* ---------------------------------------------------------------- editor */

.q-editor-head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; margin-bottom: .6rem; }
.q-editor-section { border-inline-start: 4px solid var(--muted); }
.q-editor-mc { border-inline-start: 4px solid var(--accent); }
.q-editor-short { border-inline-start: 4px solid var(--ok); }
.q-editor-long { border-inline-start: 4px solid var(--warn); }
.mc-options { display: flex; flex-direction: column; gap: .4rem; }
.add-row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.letter { display: inline-grid; place-items: center; min-width: 1.8em; height: 1.8em; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: .85em; }

/* -------------------------------------------------------------- the test */

.page-take { --base: var(--test-fs); }
.test-bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap;
  padding: .5rem 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.timer { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1.15rem; }
.timer-low { color: var(--danger); }
.save-status { color: var(--muted); font-size: .9rem; }
.save-status.bad { color: var(--danger); }
.progress { color: var(--muted); }

.test { max-width: 820px; margin: 0 auto; padding: 1.5rem 16px 6rem; font-size: var(--test-fs); line-height: 1.6; }
.test h1 { font-size: 1.5em; }
.test .q { font-size: 1em; }

.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1em; margin-bottom: 1em; transition: background .2s; }
.q.reading { background: var(--reading); }
.q-head { display: flex; gap: .7em; align-items: flex-start; }
.q-head h2, .q-head h3 { flex: 1; margin: 0; font-size: 1.1em; }
.q-num { flex: none; display: inline-grid; place-items: center; min-width: 1.9em; height: 1.9em; border-radius: 50%; background: var(--accent); color: var(--accent-text); font-weight: 700; font-size: .9em; }
.q-text { flex: 1; }
.prompt, .passage { white-space: pre-wrap; }
.passage { margin-top: .6em; }
.q-points { color: var(--muted); font-size: .8em; white-space: nowrap; padding-top: .2em; }
.btn-listen { font-size: .85em; flex: none; }
.q-section { background: var(--accent-soft); border-color: transparent; }

.options { display: flex; flex-direction: column; gap: .5em; margin-top: .8em; }
.option { display: flex; align-items: center; gap: .7em; padding: .55em .8em; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.option:hover { border-color: var(--accent); }
.option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.option input { width: 1.2em; height: 1.2em; accent-color: var(--accent); }
.option:has(input:disabled) { opacity: .55; cursor: default; }
.choose-hint { margin: .6em 0 0; font-weight: 600; color: var(--accent); }

.answer { width: 100%; margin-top: .8em; font-size: 1em; }
.or { color: var(--muted); font-size: .85em; margin-top: .7em; }
.record { margin-top: .4em; }
.record audio { width: 100%; max-width: 420px; margin: .4em 0; }
.record-done { display: flex; flex-direction: column; gap: .3em; }
.btn-record { border-color: var(--danger); color: var(--danger); }
.recording { display: flex; align-items: center; gap: .6em; font-weight: 600; color: var(--danger); }
.rec-dot { width: .8em; height: .8em; border-radius: 50%; background: var(--danger); animation: pulse 1s infinite; }
.btn-stop { background: var(--danger); border-color: var(--danger); color: #fff; }
@keyframes pulse { 50% { opacity: .3; } }

.submit-row { display: flex; justify-content: center; margin-top: 2em; }
.start { width: min(640px, 100%); }
.rules { padding-inline-start: 1.2rem; line-height: 1.7; }
.done { text-align: center; }

.preview-banner { background: var(--warn-soft); color: var(--warn); padding: .5rem 16px; font-weight: 500; text-align: center; }

.overlay { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); display: grid; place-items: center; padding: 16px; }
.overlay-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 2rem; max-width: 480px; text-align: center; }

/* --------------------------------------------------------------- grading */

.q-review { border-color: var(--warn); box-shadow: inset 4px 0 0 var(--warn); }
.q-right { box-shadow: inset 4px 0 0 var(--ok); }
.q-wrong { box-shadow: inset 4px 0 0 var(--danger); }
.mc-review { list-style: none; padding: 0; margin: .6em 0; display: flex; flex-direction: column; gap: .3em; }
.mc-review li { display: flex; gap: .5em; align-items: center; padding: .2em .5em; border-radius: 6px; }
.mc-review li.correct { background: var(--ok-soft); }
.mc-review li.chosen:not(.correct) { background: var(--danger-soft); }
.student-answer { margin: .6em 0; padding: .6em .8em; background: var(--bg); border-radius: 8px; }
.grade-row { margin-top: .6em; }
.sticky-bottom { position: sticky; bottom: 0; box-shadow: 0 -4px 16px rgb(0 0 0 / 8%); }
.comment { background: var(--accent-soft); padding: .4em .7em; border-radius: 6px; }

/* ---------------------------------------------------------------- modals */

.modal { border: 1px solid var(--line); border-radius: var(--radius); padding: 1.4rem; width: min(560px, calc(100vw - 32px)); background: var(--surface); color: var(--text); }
.modal::backdrop { background: rgb(0 0 0 / 45%); }
.modal h2 { margin-top: 0; }
.modal-actions { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1rem; flex-wrap: wrap; }
.credentials { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); max-height: 50vh; overflow: auto; }
.cred { border: 1px dashed var(--line); border-radius: 8px; padding: .6rem; font-size: .92rem; }

#toasts { position: fixed; bottom: 16px; inset-inline-end: 16px; z-index: 100; display: flex; flex-direction: column; gap: .4rem; max-width: calc(100vw - 32px); }
.toast { padding: .6rem 1rem; border-radius: 8px; background: var(--text); color: var(--bg); box-shadow: 0 4px 16px rgb(0 0 0 / 20%); }
.toast-error { background: var(--danger); color: #fff; }
.toast-ok { background: var(--ok); color: #fff; }
.toast-warn { background: var(--warn); color: #fff; }

@media print {
  body.printing-creds > *:not(dialog) { display: none !important; }
  body.printing-creds dialog { position: static; border: 0; width: 100%; max-height: none; }
  body.printing-creds .modal-actions, body.printing-creds .modal > h2 + div > p { display: none; }
  body.printing-creds .credentials { max-height: none; overflow: visible; grid-template-columns: repeat(2, 1fr); }
  .cred { break-inside: avoid; color: #000; }
}

.ai-step h3 { display: flex; align-items: center; gap: .5rem; margin: .2rem 0 .5rem; font-size: 1.05rem; }
.mono-small { font: .82rem/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.modal { max-height: calc(100vh - 32px); }

.preview-bar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding: .55rem 16px; background: var(--warn-soft); color: var(--text); border-bottom: 2px solid var(--warn); font-size: .95rem; }
.wrap > .preview-bar { border: 2px solid var(--warn); border-radius: var(--radius); margin-bottom: 1rem; }
.preview-bar strong:first-child { color: var(--warn); }
.pv-check { display: inline-flex; align-items: center; gap: .35rem; }
.preview-bar select { padding: .25rem .4rem; }
  </style>
</head>

  <script>
    // Its own script block, so it still runs if the app's code fails to load
    // at all: show the problem instead of "Loading…" forever.
    (function () {
      var multi = 'If you are signed in to more than one Google account in this browser, open the app in an Incognito window (Ctrl+Shift+N) or a Chrome profile with only your school account.';
      function showFatal(message) {
        var app = document.getElementById('app');
        if (!app || !app.querySelector('.loading')) return;
        app.innerHTML = '<div class="card narrow" style="margin:2rem auto"><h2>The app could not start</h2><p class="error"></p><p class="muted">Please send a screenshot of this message to whoever set up the app.</p></div>';
        app.querySelector('.error').textContent = message;
      }
      window.addEventListener('error', function (e) {
        var where = (e.filename || '').split('/').pop();
        showFatal(e.message + (e.lineno ? ' (' + (where ? where + ', ' : '') + 'line ' + e.lineno + ')' : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        showFatal(String((e.reason && e.reason.message) || e.reason));
      });
      setTimeout(function () { showFatal('Still loading after a minute. ' + multi); }, 60000);
    })();
  </script>
